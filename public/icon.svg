  <rect x="126" y="118" width="16" height="120" rx="8" fill="#2b3446"/>
  <rect x="370" y="118" width="16" height="120" rx="8" fill="#2b3446"/>

  <!-- A figure mid pull-up: shoulders, arms, torso, legs. -->
